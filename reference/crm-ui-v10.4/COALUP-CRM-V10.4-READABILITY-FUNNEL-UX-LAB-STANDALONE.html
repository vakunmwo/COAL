/* ==========================================================
   V10.4 — READABILITY + FUNNEL UX LAB
   Regra: nenhuma informação operacional intencional < 12px.
   ========================================================== */

:root{
  --fs-scene:32px;
  --fs-section:18px;
  --fs-card:16px;
  --fs-body:15px;
  --fs-secondary:14px;
  --fs-label:12px;
  --fs-button:14px;
  --fs-input:15px;
  --fs-kpi:28px;
  --lh-body:1.55;
}

html,body{font-size:var(--fs-body);line-height:var(--lh-body)}
button,input,select,textarea{font-size:var(--fs-input)}
.btn,.new-btn,.nav-btn,.seg-btn,.filter,.user-menu button{
  font-family:var(--sans);
  font-size:var(--fs-button);
  line-height:1.25;
}
.btn,.new-btn,.seg-btn,.filter,.icon-button,.user-btn{min-height:44px}
.btn.sm{min-height:40px;font-size:13px;padding:8px 11px}
.new-btn{height:44px}
.icon-button,.user-btn{width:44px;height:44px}
.eyebrow,.panel-head,.ctx-kicker,.ctx-label,.form-label,.field label,
.kpi label,.partner-chip,.training,.stage-head>span,.operator-chip,.proposal-meta{
  font-family:var(--sans);
  font-size:var(--fs-label);
  letter-spacing:.02em;
}
.brand b{font-family:var(--sans);font-size:14px}
.brand span{font-family:var(--sans);font-size:12px}
.search-wrap input{height:44px;font-size:15px}
.search-group{font:600 12px/1.35 var(--sans)}
.search-item b{font-size:15px}.search-item span{font:12px/1.4 var(--sans)}
.nav-btn{font-size:14px;min-height:50px}
.scene-head h1{font-size:var(--fs-scene);line-height:1.1;letter-spacing:-.035em}
.scene-sub{font-size:var(--fs-body);line-height:1.55}
.panel-head{min-height:46px}
.panel-head b{font-size:13px}
.panel-body{font-size:var(--fs-body)}
.kpi{padding:14px}.kpi label{font-size:12px}.kpi strong{font:600 var(--fs-kpi)/1.1 var(--mono)}.kpi small{font-size:13px;line-height:1.4}
.priority b,.simple-row b,.alert-row b{font-size:15px}.priority p,.simple-row p,.alert-row p{font-size:14px;line-height:1.5}.priority .meta{font:12px/1.35 var(--sans)}
.pill{font:600 12px/1.2 var(--sans);padding:5px 8px}
.ctx-empty b{font-size:16px}.ctx-empty span{font-size:14px;line-height:1.5}
.context-head{height:50px;font:12px/1.2 var(--sans)}
.context-body{padding:15px;font-size:14px}
.ctx-kicker{font-weight:650;color:var(--blue)}
.ctx-title{font-size:24px;line-height:1.2}
.ctx-sub{font-size:14px;line-height:1.5}
.ctx-label{font-weight:650}
.ctx-row{font-size:14px;line-height:1.45;margin:10px 0}
.accordion summary{padding:13px;font-size:14px;min-height:46px;align-items:center}
.accordion-content{padding:13px;font-size:14px;line-height:1.55}
.gate-item{font-size:14px;line-height:1.45}
.history-line b{font-size:14px}.history-line span{font:12px/1.4 var(--sans)}
.field label,.form-label{font-size:12px;font-weight:600}
.field input,.field select,.field textarea,.form-control{font-size:15px;min-height:44px}
.quick-card b{font-size:15px}.quick-card span{font-size:13px;line-height:1.45}
.toast{font:13px/1.4 var(--sans)}
.follow-card h3{font-size:16px;line-height:1.35}.follow-card p{font-size:14px;line-height:1.45}
.proposal-card h3{font-size:16px}.proposal-card .value{font:600 20px/1.15 var(--mono)}
.proposal-meta{font-size:12px;line-height:1.4}
.note-card b{font:600 12px/1.3 var(--sans)}.note-card p{font-size:14px;line-height:1.5}
.operator-chip{font-size:12px}
.action-row b{font-size:15px}.action-row p{font:13px/1.4 var(--sans)}.action-row .due{font:13px/1.35 var(--sans)}
.project-card b{font-size:15px}.project-card p{font-size:14px}.project-meta{font:12px/1.35 var(--sans)}
.fin-card label{font:12px/1.35 var(--sans)}.fin-card strong{font:600 22px/1.1 var(--mono)}.fin-card small{font-size:13px}
.money-table th{font:600 12px/1.35 var(--sans)}.money-table td{font-size:14px}
.manual-nav button{font-size:14px}.doc p,.doc li{font-size:15px}.doc h3{font-size:18px}

/* ------------ V10.4 SALES ------------ */
.sales-v104 .kpis{margin-bottom:14px}
.sales-v104 .subnav{
  position:sticky;
  top:-18px;
  z-index:12;
  margin:0 -18px 14px;
  padding:10px 18px;
  background:linear-gradient(180deg,#161616 78%,rgba(22,22,22,.88));
  border-bottom:1px solid var(--line2);
}
.sales-v104 .subnav .seg-btn{
  min-height:44px;
  padding:0 15px;
  font-size:14px;
  font-weight:650;
}
.sales-v104 .sales-toolbar{grid-template-columns:repeat(5,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.sales-v104 .filter{font-size:14px;height:44px}

/* possible clients stays useful but less dominant */
.sales-v104 .prospect-strip{gap:10px}
.sales-v104 .prospect-card{min-width:245px;padding:13px}
.sales-v104 .prospect-card b{font-size:15px}
.sales-v104 .prospect-card p{font-size:13px;line-height:1.45;margin:5px 0}

/* desktop funnel */
.funnel-desktop{display:block}
.funnel-mobile{display:none}
.sales-v104 .funnel-wrap{padding:10px}
.sales-v104 .funnel{
  grid-auto-columns:minmax(300px,320px);
  gap:10px;
  align-items:start;
}
.sales-v104 .stage{
  min-height:520px;
  border-radius:11px;
  overflow:visible;
}
.sales-v104 .stage-head{
  position:sticky;
  top:0;
  z-index:3;
  padding:14px;
  background:#1a1c1f;
  border-radius:11px 11px 0 0;
}
.sales-v104 .stage-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sales-v104 .stage-name{
  font-size:15px;
  line-height:1.3;
  font-weight:700;
  color:var(--text);
}
.sales-v104 .stage-count{
  min-width:30px;height:30px;border:1px solid var(--line);border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  font:600 13px/1 var(--mono);color:var(--text2)
}
.sales-v104 .stage-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 10px;
  margin-top:12px;
}
.stage-metric{min-width:0}
.stage-metric span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.stage-metric strong{display:block;margin-top:2px;font-size:14px;line-height:1.35;color:var(--text2);font-weight:650}
.sales-v104 .deal-list{padding:9px;gap:9px;min-height:390px}
.sales-v104 .deal{
  border-radius:10px;
  padding:14px;
  background:linear-gradient(180deg,#24272b,#202327);
}
.sales-v104 .deal:hover{border-color:#626a75;transform:translateY(-1px)}
.sales-v104 .deal.risk{border-left:3px solid var(--red)}
.sales-v104 .deal-top{align-items:flex-start}
.sales-v104 .deal-name{font-size:16px;line-height:1.35;font-weight:700}
.sales-v104 .deal-value{font:650 15px/1.35 var(--mono)}
.sales-v104 .deal-contact{font:14px/1.45 var(--sans);margin-top:5px}
.sales-v104 .deal-stage{font:600 13px/1.35 var(--sans);margin-top:13px;color:var(--blue)}
.sales-v104 .deal-next-label{font-size:12px;color:var(--muted);margin-top:13px}
.sales-v104 .deal-next{font-size:15px;line-height:1.42;margin-top:3px}
.sales-v104 .deal-next-date{font-size:13px;color:var(--muted);margin-top:4px}
.sales-v104 .deal-foot{font:13px/1.35 var(--sans);margin-top:14px;align-items:center}
.sales-v104 .deal-status{font-size:12px;font-weight:700}

/* follow-up */
.follow-section{margin-bottom:12px}
.follow-section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 0 8px;padding:0 2px;
}
.follow-section-title h2{font-size:18px;line-height:1.3;margin:0;color:var(--text)}
.follow-section-title span{font-size:13px;color:var(--muted)}
.follow-card-v104{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
  border:1px solid var(--line);
  background:#1a1c1f;
  border-radius:10px;
  padding:14px;
  margin-bottom:8px;
}
.follow-card-v104.overdue{border-left:3px solid var(--red)}
.follow-card-v104.today{border-left:3px solid var(--yellow)}
.follow-card-v104.missing{border-left:3px solid var(--purple)}
.follow-main h3{font-size:16px;line-height:1.35;margin:0;color:var(--text)}
.follow-main .next{font-size:15px;line-height:1.45;margin-top:5px;color:var(--text2)}
.follow-main .meta{font-size:13px;line-height:1.45;margin-top:5px;color:var(--muted)}
.follow-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* proposals */
.proposal-board-v104{display:flex;flex-direction:column;gap:14px}
.proposal-group h2{font-size:18px;margin:0 0 8px;color:var(--text)}
.proposal-grid-v104{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.proposal-card-v104{
  border:1px solid var(--line);
  background:linear-gradient(180deg,#1c1e21,#181a1c);
  border-radius:10px;
  padding:15px;
  cursor:pointer;
}
.proposal-card-v104:hover{border-color:#575f69}
.proposal-card-v104 h3{font-size:16px;line-height:1.35;margin:0;color:var(--text)}
.proposal-card-v104 .proposal-value{font:650 22px/1.2 var(--mono);color:var(--purple);margin:10px 0}
.proposal-row{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:13px;line-height:1.4}
.proposal-row span:first-child{color:var(--muted)}
.proposal-state{display:inline-flex;margin-top:11px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}

/* Venda 360 */
.deal360-head{padding-bottom:3px}
.deal360-title-row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.deal360-title{font-size:26px;line-height:1.15;color:var(--text);font-weight:750;letter-spacing:-.025em}
.deal360-value{font:650 18px/1.25 var(--mono);color:var(--blue);white-space:nowrap}
.deal360-contact{font-size:14px;color:var(--muted);margin-top:5px}
.deal360-meta{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-top:14px;padding:11px;border:1px solid var(--line2);border-radius:9px;background:#161719
}
.deal360-meta div span{display:block;font-size:12px;color:var(--muted)}
.deal360-meta div strong{display:block;font-size:14px;color:var(--text2);margin-top:2px}
.deal360-primary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.deal360-primary .btn{min-height:46px}
.next-action-box{
  border:1px solid #3b5063;
  background:#17222b;
  border-radius:10px;
  padding:13px;
}
.next-action-box.attention{border-color:#675842;background:#28231a}
.next-action-box.missing{border-color:#594869;background:#241f29}
.next-action-label{font-size:12px;color:var(--muted);font-weight:650}
.next-action-title{font-size:16px;color:var(--text);font-weight:700;margin-top:4px;line-height:1.4}
.next-action-meta{font-size:13px;color:var(--muted);margin-top:4px}
.empty-structured{
  border:1px dashed var(--line);
  border-radius:8px;
  padding:12px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* mobile stage view */
.mobile-stage-strip{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.mobile-stage-strip::-webkit-scrollbar{display:none}
.mobile-stage-btn{
  min-height:44px;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;
  background:#17191b;color:var(--muted);padding:0 13px;font-size:13px;font-weight:650
}
.mobile-stage-btn.active{background:#27313b;border-color:#45617a;color:var(--text)}
.mobile-stage-summary{
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  padding:13px;border:1px solid var(--line);border-radius:10px;background:#191b1e;margin-bottom:9px
}
.mobile-stage-summary h2{font-size:18px;line-height:1.3;margin:0;color:var(--text)}
.mobile-stage-summary p{font-size:13px;line-height:1.45;margin:4px 0 0;color:var(--muted)}
.mobile-stage-summary strong{font:650 16px/1.3 var(--mono);color:var(--blue)}
.mobile-deal-list{display:flex;flex-direction:column;gap:9px}

/* wider context for cockpit */
@media(min-width:981px){
  .main{grid-template-columns:176px minmax(0,1fr) 390px}
}

@media(max-width:1100px){
  .proposal-grid-v104{grid-template-columns:1fr 1fr}
}

@media(max-width:760px){
  :root{
    --fs-scene:27px;
    --fs-section:18px;
    --fs-card:16px;
    --fs-body:16px;
    --fs-secondary:14px;
    --fs-label:13px;
    --fs-button:16px;
    --fs-input:16px;
    --fs-kpi:26px;
  }

  html,body{font-size:16px}
  .scene{padding:14px 10px 24px}

CU.sha256Fallback=function(ascii){
  function rr(value,amount){return(value>>>amount)|(value<<(32-amount))}
  const mp=Math.pow,mw=mp(2,32);let result='',words=[],len=ascii.length*8,hash=[];const k=[],comp={};let pc=0;

  words[words.length]=((len/mw)|0);words[words.length]=len;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash.slice(0);for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;hash.pop()}for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=(b<16?'0':'')+b.toString(16)}return result;
};
CU.sha256=async text=>{try{if(globalThis.crypto?.subtle){const data=new TextEncoder().encode(text),hash=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(err){console.warn('[V10.4] Web Crypto indisponível',err)}return CU.sha256Fallback(text)};

(() => {
'use strict';
const CU=window.CU;

CU.state.meta.version='10.4';
CU.state.ui.salesView=CU.state.ui.salesView||'funnel';
CU.state.ui.mobileSalesStage=CU.state.ui.mobileSalesStage||'proposta';

/*
UX LAB:
O backend real ainda não está ligado.
Para aproximar a experiência do contrato final, cada venda aberta ganha um
nextActionTaskId apontando para uma Action real quando possível.
Os campos legacy nextTitle/nextDue continuam existentes apenas para
compatibilidade com a V10.3.
*/
CU.state.deals.filter(d=>d.status==='open').forEach(d=>{
  let task=CU.state.actions.find(a=>a.entityType==='deal'&&a.entityId===d.id&&a.status==='open');
  if(!task && d.nextTitle && d.nextDue){
    task={
      id:CU.uid('A'),
      title:d.nextTitle,
      due:d.nextDue,
      status:'open',
      owner:d.owner,
      entityType:'deal',
      entityId:d.id,
      source:'v104-compat'
    };
    CU.state.actions.push(task);
  }
  d.nextActionTaskId=task?.id||null;
});

CU.nextActionOf=d=>{
  if(!d)return null;
  let task=d.nextActionTaskId?CU.state.actions.find(a=>a.id===d.nextActionTaskId&&a.status==='open'):null;
  if(!task){
    task=CU.state.actions.find(a=>a.entityType==='deal'&&a.entityId===d.id&&a.status==='open');
    if(task)d.nextActionTaskId=task.id;
  }
  return task||null;
};

CU.hasAttention=d=>{
  const task=CU.nextActionOf(d);
  return !!(d.risk || !task || (task.due && task.due<CU.today()));
};

CU.nextActionBucket=d=>{
  const task=CU.nextActionOf(d);
  if(!task)return 'missing';
  if(task.due<CU.today())return 'overdue';
  if(task.due===CU.today())return 'today';
  return 'next';
};

CU.proposalDisplayState=p=>{
  if(p.status==='draft')return {key:'draft',label:'Rascunho'};
  if(p.status==='accepted')return {key:'accepted',label:'Aceita'};
  if(['rejected','closed'].includes(p.status))return {key:'closed',label:'Recusada / encerrada'};
  if(p.status==='sent' && p.followupDue && p.followupDue<=CU.today())return {key:'waiting',label:'Aguardando retorno'};
  if(p.status==='sent')return {key:'sent',label:'Enviada'};
  return {key:p.status||'unknown',label:p.status||'Sem estado'};
};

CU.saveState('v104.state.bridge');
})();

CU.financeBudget=()=>`<div class="grid"><div class="panel s8"><div class="panel-head"><b>ORÇAMENTO · ${CU.state.budgets.month}</b><span>planejado x realizado pago</span></div><div class="panel-body" style="overflow:auto"><table class="money-table"><thead><tr><th>Categoria</th><th>Planejado</th><th>Realizado</th><th>Diferença</th><th>Uso</th><th></th></tr></thead><tbody>${CU.state.budgets.categories.map(c=>{const actual=CU.actualBudget(c.name),diff=actual-Number(c.planned),pct=c.planned?Math.min(100,(actual/c.planned)*100):0;return `<tr><td>${CU.esc(c.name)}</td><td class="amount">${CU.money(c.planned)}</td><td class="amount">${CU.money(actual)}</td><td class="amount ${diff>0?'red':'green'}">${diff>=0?'+ ':''}${CU.money(diff)}</td><td style="min-width:130px"><div class="budget-bar ${diff>0?'over':''}"><span style="width:${pct}%"></span></div></td><td><button class="btn sm ghost" data-budget-edit="${CU.esc(c.name)}">EDITAR</button></td></tr>`}).join('')}</tbody></table></div></div><div class="panel s4"><div class="panel-head"><b>COMO LER</b></div><div class="panel-body"><p class="muted">Diferença = realizado pago - planejado. Positivo significa gasto acima do orçamento da categoria.</p></div></div></div>`;

CU.financeCashflow=fm=>{

CU.financeCalendar=()=>{
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),cells=[];
  for(let i=0;i<first.getDay();i++)cells.push(null);for(let day=1;day<=last.getDate();day++)cells.push(new Date(y,m,day));
  const ev=date=>{if(!date)return[];const iso=date.toISOString().slice(0,10),arr=[];CU.state.receivables.filter(r=>r.due===iso&&CU.remainingReceivable(r)>0).forEach(r=>arr.push({type:'in',text:`Receber ${CU.money(CU.remainingReceivable(r))}`}));CU.state.expenses.filter(e=>e.due===iso&&CU.expStatus(e)!=='paid').forEach(e=>arr.push({type:'out',text:`Pagar ${CU.money(e.amount)}`}));return arr};
  return `<div class="panel"><div class="panel-head"><b>CALENDÁRIO FINANCEIRO</b><span>${CU.month()}</span></div><div class="panel-body"><div class="calendar-grid">${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells.map(date=>date?`<div class="cal-day"><b>${date.getDate()}</b>${ev(date).map(e=>`<div class="cal-event ${e.type}">${CU.esc(e.text)}</div>`).join('')}</div>`:'<div></div>').join('')}</div></div></div>`;
};

CU.financialUpcoming=n=>{
  const arr=[];CU.state.receivables.filter(r=>CU.remainingReceivable(r)>0).forEach(r=>arr.push({date:r.due,type:'in',title:`Receber · ${CU.clientName(r.clientId)}`,amount:CU.remainingReceivable(r)}));CU.state.expenses.filter(e=>CU.expStatus(e)!=='paid').forEach(e=>arr.push({date:e.due,type:'out',title:`Pagar · ${e.description}`,amount:e.amount}));

CU.gateFor=d=>{

CU.dealForm=()=>{

    CU.state.deals.push(d);CU.state.actions.push({id:CU.uid('A'),title:next,due:CU.addDays(1),status:'open',owner,entityType:'deal',entityId:d.id});

CU.chooseDealThen=action=>{

  CU.openModal(action==='proposal'?'Criar proposta':'Registrar conversa',`<div class="field"><label>VENDA</label><select class="form-control" id="chooseDeal">${opts}</select></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn primary" id="continueDeal">CONTINUAR</button>`);

CU.actionForm=(entityType='general',entityId='')=>{
  CU.openModal('Nova ação',`<div class="form-grid"><div class="wide"><div class="form-label">AÇÃO</div><input class="form-control" id="aTitle"></div><div><div class="form-label">PRAZO</div><input class="form-control" id="aDue" type="date" value="${CU.addDays(1)}"></div><div><div class="form-label">RESPONSÁVEL</div><select class="form-control" id="aOwner"><option value="admin123">Sócio A</option><option value="Gadmin123">Sócio B</option></select></div></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn primary" id="saveAction">SALVAR</button>`);
  document.getElementById('aOwner').value=CU.session.user;
  document.getElementById('saveAction').onclick=()=>{
    const title=CU.v('aTitle'),due=CU.v('aDue'),owner=CU.v('aOwner');if(!title||!due)return CU.toast('Informe ação e prazo.','err');
    CU.state.actions.push({id:CU.uid('A'),title,due,status:'open',owner,entityType,entityId});CU.addEvent(`Ação criada · ${title}`);CU.saveState('action.new');CU.closeModal();CU.renderApp(false);CU.toast('Ação criada');
  };
};

CU.toggleAction=id=>{
  const a=CU.state.actions.find(x=>x.id===id);if(!a)return;a.status=a.status==='done'?'open':'done';CU.addEvent(`${a.status==='done'?'Ação concluída':'Ação reaberta'} · ${a.title}`);CU.saveState('action.toggle');CU.renderApp(false);if(CU.state.ui.context?.id===id)CU.renderContext();CU.toast(a.status==='done'?'Ação concluída':'Ação reaberta','info');
};

CU.conversationForm=id=>{
  const d=CU.state.deals.find(x=>x.id===id);
  CU.openModal(`Registrar conversa · ${d.name}`,`<div class="field"><label>RESUMO DA CONVERSA</label><textarea class="form-control" id="convSummary" placeholder="O que aconteceu?"></textarea></div><div class="form-grid"><div><div class="form-label">PRÓXIMO PASSO</div><input class="form-control" id="convNext" placeholder="Ex.: enviar proposta"></div><div><div class="form-label">DATA</div><input class="form-control" id="convDue" type="date" value="${CU.addDays(1)}"></div></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn primary" id="saveConversation">SALVAR</button>`);
  document.getElementById('saveConversation').onclick=()=>{
    const summary=CU.v('convSummary'),next=CU.v('convNext'),due=CU.v('convDue');if(!summary)return CU.toast('Escreva um resumo da conversa.','err');
    d.history.unshift({text:`Conversa: ${summary}`,actor:CU.session.user,date:CU.today(),time:CU.nowTime()});
    if(next&&due){d.nextTitle=next;d.nextDue=due;CU.state.actions.push({id:CU.uid('A'),title:next,due,status:'open',owner:d.owner,entityType:'deal',entityId:d.id})}
    CU.addEvent(`Conversa registrada · ${d.name}`);CU.saveState('conversation');CU.closeModal();CU.renderApp(false);CU.state.ui.context={type:'deal',id};CU.renderContext();CU.toast('Conversa registrada');
  };
};

CU.proposalForm=id=>{
  const d=CU.state.deals.find(x=>x.id===id),existing=CU.state.proposals.find(p=>p.dealId===id);
  CU.openModal(`${existing?'Proposta':'Criar proposta'} · ${d.name}`,`<div class="form-grid"><div><div class="form-label">VALOR</div><input class="form-control" id="proposalValue" type="number" step="0.01" value="${existing?.value||d.value}"></div><div><div class="form-label">PRÓXIMO RETORNO</div><input class="form-control" id="proposalFollow" type="date" value="${existing?.followupDue||CU.addDays(2)}"></div><div class="wide"><div class="form-label">STATUS</div><select class="form-control" id="proposalStatus"><option value="draft">Rascunho</option><option value="sent" ${existing?.status==='sent'?'selected':''}>Enviada</option></select></div></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn primary" id="saveProposal">SALVAR</button>`);
  document.getElementById('saveProposal').onclick=()=>{
    const value=Number(document.getElementById('proposalValue').value),follow=CU.v('proposalFollow'),status=CU.v('proposalStatus');if(!value||!follow)return CU.toast('Preencha valor e próximo retorno.','err');
    if(existing){existing.value=value;existing.followupDue=follow;existing.status=status}else CU.state.proposals.push({id:CU.uid('PR'),dealId:id,value,status,createdAt:CU.today(),followupDue:follow});
    d.value=value;d.nextTitle='Acompanhar proposta';d.nextDue=follow;if(!['proposta','decisao'].includes(d.stage)){d.stage='proposta';d.enteredAt=CU.today()}
    d.history.unshift({text:`Proposta ${existing?'atualizada':'criada'} · ${CU.money(value)}`,actor:CU.session.user,date:CU.today(),time:CU.nowTime()});
    CU.addEvent(`Proposta ${existing?'atualizada':'criada'} · ${d.name}`);CU.saveState('proposal');CU.closeModal();CU.renderApp(false);CU.state.ui.context={type:'deal',id};CU.renderContext();CU.toast('Proposta salva');
  };
};

CU.requestAdvance=(id,target=null)=>{
  const d=CU.state.deals.find(x=>x.id===id);if(!d||d.status!=='open')return;
  const idx=CU.state.stages.findIndex(s=>s.id===d.stage),targetStage=target||CU.state.stages[idx+1]?.id;
  if(!targetStage)return CU.toast('A venda já está na última etapa. Use a decisão comercial.','info');
  if(CU.state.stages.findIndex(s=>s.id===targetStage)<=idx)return CU.moveDeal(d,targetStage,'Retorno manual');
  const missing=CU.gateFor(d).filter(x=>!x.ok);
  if(!missing.length)return CU.moveDeal(d,targetStage,'Gate atendido');
  CU.openModal('Avançar com pendências',`<p class="muted">Faltam ${missing.length} item(ns). O gate é suave: você pode avançar, mas precisa registrar o motivo.</p><div class="gate-list">${missing.map(x=>`<div class="gate-item"><span class="gate-miss">!</span><span>${CU.esc(x.label)}</span></div>`).join('')}</div><div class="field"><label>MOTIVO DO OVERRIDE</label><textarea class="form-control" id="overrideReason"></textarea></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn primary" id="confirmAdvance">AVANÇAR</button>`);
  document.getElementById('confirmAdvance').onclick=()=>{const reason=CU.v('overrideReason');if(!reason)return CU.toast('Informe o motivo para avançar.','err');CU.moveDeal(d,targetStage,reason);CU.closeModal()};
};
CU.moveDeal=(d,target,reason)=>{
  const old=d.stage;d.stage=target;d.enteredAt=CU.today();d.risk=false;d.history.unshift({text:`Etapa: ${CU.stageName(old)} → ${CU.stageName(target)} · ${reason}`,actor:CU.session.user,date:CU.today(),time:CU.nowTime()});
  CU.addEvent(`${d.name} avançou para ${CU.stageName(target)}`);CU.saveState('deal.advance');CU.renderApp(false);CU.state.ui.context={type:'deal',id:d.id};CU.renderContext();CU.toast(`${d.name} → ${CU.stageName(target)}`);
};

CU.dealAction=(action,id)=>{
  if(action==='conversation')CU.conversationForm(id);
  if(action==='task')CU.actionForm('deal',id);
  if(action==='proposal')CU.proposalForm(id);
  if(action==='advance')CU.requestAdvance(id);
};

CU.dealFinal=(type,id)=>{
  const d=CU.state.deals.find(x=>x.id===id);
  if(type==='won'){
    CU.openModal(`Venda ganha · ${d.name}`,`<p class="muted">Ganhou cria cliente, projeto e recebíveis. Não registra pagamento automaticamente.</p><div class="form-grid"><div><div class="form-label">VALOR FINAL</div><input class="form-control" id="wonValue" type="number" step="0.01" value="${d.value}"></div><div><div class="form-label">PARCELAS</div><input class="form-control" id="wonInstallments" type="number" min="1" max="24" value="2"></div><div><div class="form-label">CONDIÇÃO</div><input class="form-control" id="wonCondition" value="50% + 50%"></div><div><div class="form-label">INÍCIO PREVISTO</div><input class="form-control" id="wonStart" type="date" value="${CU.addDays(3)}"></div></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn success" id="saveWon">CONFIRMAR VENDA</button>`);
    document.getElementById('saveWon').onclick=()=>CU.confirmWon(d);
  }
  if(type==='lost'){
    CU.openModal(`Venda perdida · ${d.name}`,`<div class="field"><label>MOTIVO</label><textarea class="form-control" id="lostReason"></textarea></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn danger" id="saveLost">REGISTRAR PERDA</button>`);
    document.getElementById('saveLost').onclick=()=>{const reason=CU.v('lostReason');if(!reason)return CU.toast('Informe o motivo.','err');d.status='lost';d.history.unshift({text:`Venda perdida · ${reason}`,actor:CU.session.user,date:CU.today(),time:CU.nowTime()});CU.addEvent(`Venda perdida · ${d.name}`);CU.saveState('deal.lost');CU.closeModal();CU.state.ui.context=null;CU.renderApp(false);CU.toast('Perda registrada','info')};
  }
  if(type==='later'){
    CU.openModal(`Não agora · ${d.name}`,`<div class="form-grid"><div><div class="form-label">RETORNAR EM</div><input class="form-control" id="laterDate" type="date" value="${CU.addDays(30)}"></div><div class="wide"><div class="form-label">CONDIÇÃO / MOTIVO</div><textarea class="form-control" id="laterReason"></textarea></div></div>`,`<button class="btn" data-close-modal>CANCELAR</button><button class="btn warn" id="saveLater">AGENDAR RETORNO</button>`);
    document.getElementById('saveLater').onclick=()=>{const date=CU.v('laterDate'),reason=CU.v('laterReason');if(!date||!reason)return CU.toast('Informe data e condição de retorno.','err');d.status='later';d.history.unshift({text:`Não agora · ${reason}`,actor:CU.session.user,date:CU.today(),time:CU.nowTime()});CU.state.actions.push({id:CU.uid('A'),title:`Retomar ${d.name}`,due:date,status:'open',owner:d.owner,entityType:'deal',entityId:d.id});CU.addEvent(`Venda marcada para retorno · ${d.name}`);CU.saveState('deal.later');CU.closeModal();CU.state.ui.context=null;CU.renderApp(false);CU.toast('Retorno agendado')};
  }
};

CU.confirmWon=d=>{
  const value=Number(document.getElementById('wonValue').value),n=Math.max(1,Number(document.getElementById('wonInstallments').value)||1),condition=CU.v('wonCondition'),start=CU.v('wonStart');
  if(!value||!condition||!start)return CU.toast('Preencha os campos da venda ganha.','err');
  d.value=value;d.status='won';d.history.unshift({text:`Venda ganha · ${CU.money(value)} · ${condition}`,actor:CU.session.user,date:CU.today(),time:CU.nowTime()});
  let c=CU.state.clients.find(c=>c.name.toLowerCase()===d.name.toLowerCase());
  if(!c){c={id:CU.uid('C'),name:d.name,contact:d.contact,role:'Contato principal',phone:'',email:'',service:d.service,owner:d.owner,status:'active'};CU.state.clients.push(c)}

  const base=Math.floor((value/n)*100)/100;let created=0;

(() => {
'use strict';
const CU=window.CU;

CU.stageMetricsV104=stage=>{
  const ds=CU.openDeals().filter(d=>d.stage===stage);
  return{
    count:ds.length,
    value:ds.reduce((a,d)=>a+Number(d.value),0),
    avg:ds.length?Math.round(ds.reduce((a,d)=>a+CU.dealAge(d),0)/ds.length):null,
    attention:ds.filter(CU.hasAttention).length
  };
};

  const status=!task?'SEM PRÓXIMO PASSO':bucket==='overdue'?'VENCIDO':d.risk?'ATENÇÃO':'OK';
  const statusClass=!task?'purple':bucket==='overdue'?'red':d.risk?'yellow':'green';
  return `<article class="deal ${CU.hasAttention(d)?'risk':''}" ${mobile?'':'draggable="true"'} data-open-entity="${d.id}" data-type="deal">

    <div class="deal-next-date">${CU.esc(dueText)}</div>
    <div class="deal-foot">
      <span>${CU.ownerName(d.owner)}</span>

    <select class="filter" data-filter="stage"><option value="all">Todas etapas</option>${CU.state.stages.map(s=>`<option value="${s.id}" ${f.stage===s.id?'selected':''}>${CU.esc(s.name)}</option>`).join('')}</select>
    <select class="filter" data-filter="risk"><option value="all">Toda atenção</option><option value="risk" ${f.risk==='risk'?'selected':''}>Precisa de atenção</option><option value="ok" ${f.risk==='ok'?'selected':''}>Sem atenção</option></select>
    <select class="filter" data-filter="service"><option value="all">Todos serviços</option>${services.map(s=>`<option value="${CU.esc(s)}" ${f.service===s?'selected':''}>${CU.esc(s)}</option>`).join('')}</select>
    <select class="filter" data-filter="next"><option value="all">Todo próximo passo</option><option value="today" ${f.next==='today'?'selected':''}>Hoje</option><option value="late" ${f.next==='late'?'selected':''}>Vencido</option></select>
  </div>`;
};

CU.filteredDealsV104=()=>{
  const f=CU.state.ui.filters;
  return CU.openDeals().filter(d=>{
    const task=CU.nextActionOf(d);
    const risk=CU.hasAttention(d);
    return (f.owner==='all'||d.owner===f.owner)
      &&(f.stage==='all'||d.stage===f.stage)
      &&(f.risk==='all'||(f.risk==='risk'?risk:!risk))
      &&(f.service==='all'||d.service===f.service)
      &&(f.next==='all'||(f.next==='late'?(task&&task.due<CU.today()):f.next==='today'?(task&&task.due===CU.today()):true));
  });
};

CU.salesFunnelDesktopV104=deals=>`<div class="funnel-desktop">

</div>`;

  const deals=CU.filteredDealsV104();
  return `${CU.salesFiltersV104()}${CU.salesFunnelDesktopV104(deals)}${CU.salesFunnelMobileV104(deals)}`;

(() => {
'use strict';
const CU=window.CU;
const baseContext=CU.contextHTML;

CU.dealContextV104=id=>{
  const d=CU.state.deals.find(x=>x.id===id);

  const proposal=CU.state.proposals.find(p=>p.dealId===id);
  const gate=CU.gateFor(d);
  const task=CU.nextActionOf(d);
  const bucket=CU.nextActionBucket(d);
  const history=d.history||[];
  const diagnosis=history.filter(h=>/diagn|problema|conversa|evid/i.test(h.text));

      <div><span>Responsável</span><strong>${CU.ownerName(d.owner)}</strong></div>

ss="login-submit">ENTRAR</button><div class="login-error" id="loginError"></div><div class="demo-login">Contas de laboratório:<div class="demo-users"><span class="demo-user">admin123</span><span class="demo-user">Gadmin123</span></div></div></form></div>

CU.loginSubmit=async e=>{
  e.preventDefault();
  const user=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;
  if(!CU.USERS[user])return document.getElementById('loginError').textContent='Usuário não encontrado.';
  if(await CU.sha256(password)!==CU.USERS[user].hash)return document.getElementById('loginError').textContent='Senha incorreta.';
  CU.session={user,route:'today',focus:'Hoje',loginAt:Date.now()};CU.saveSession();CU.startPresence();CU.addEvent(`${CU.ownerName(user)} entrou no CRM`,user);CU.renderApp();
};

CU.logout=()=>{CU.addEvent(`${CU.ownerName(CU.session.user)} saiu do CRM`,CU.session.user);CU.stopPresence();CU.session=null;CU.clearSession();CU.renderLogin()};

CU.startPresence=()=>{CU.stopPresence();CU.publishPresence();CU.presenceTimer=setInterval(CU.publishPresence,3500)};
CU.stopPresence=()=>{if(CU.presenceTimer)clearInterval(CU.presenceTimer);CU.presenceTimer=null;if(CU.bc&&CU.session)CU.bc.postMessage({type:'off',user:CU.session.user})};
CU.publishPresence=()=>{if(!CU.session)return;const p={user:CU.session.user,route:CU.state.ui.route,focus:CU.session.focus||CU.state.ui.route,last:Date.now()};CU.presence[CU.session.user]=p;if(CU.bc)CU.bc.postMessage({type:'presence',payload:p});CU.renderPresence()};
CU.presenceSnapshot=()=>{const cut=Date.now()-12000;Object.keys(CU.presence).forEach(k=>{if(CU.presence[k].last<cut)delete CU.presence[k]});return CU.presence};
CU.presenceHTML=()=>{CU.presenceSnapshot();const all=[CU.presence[CU.session?.user],...Object.values(CU.presence).filter(p=>p.user!==CU.session?.user)].filter(Boolean);if(!all.length&&CU.session)all.push({user:CU.session.user,route:CU.state.ui.route,focus:CU.session.focus||CU.state.ui.route,last:Date.now()});return all.map(p=>`<div class="coop-item ${p.user!==CU.session.user?'partner':''}"><div class="avatar">${p.user==='Gadmin123'?'G':'A'}</div><div><div class="coop-name">${CU.ownerName(p.user)} ${p.user===CU.session.user?'<span class="muted">(você)</span>':''}</div><div class="coop-meta">${CU.esc(p.focus||p.route)}</div></div><span class="online">ONLINE</span></div>`).join('')};
CU.renderPresence=()=>{if(!CU.session)return;CU.presenceSnapshot();const other=Object.values(CU.presence).find(p=>p.user!==CU.session.user),top=document.getElementById('partnerTop');if(top)top.textContent=other?`${CU.ownerName(other.user)} · ${other.focus||other.route}`:'parceiro offline';const co=document.getElementById('coopToday');if(co)co.innerHTML=CU.presenceHTML()};
if(CU.bc)CU.bc.onmessage=e=>{const m=e.data||{};if(m.type==='presence'){CU.presence[m.payload.user]=m.payload;CU.renderPresence()}if(m.type==='off'){delete CU.presence[m.user];CU.renderPresence()}if(m.type==='state'&&m.from!==CU.session?.user){CU.state=m.state;CU.renderApp(false);CU.toast(`Atualização recebida de ${CU.ownerName(m.from)}`,'info')}};

CU.renderApp=(full=true)=>{
  if(!CU.session)return CU.renderLogin();

  CU.renderScene();CU.renderContext();CU.bindShell();CU.bindScene();CU.renderPresence();
};

CU.bindShell=()=>{
  document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>CU.openRoute(b.dataset.route));
  document.getElementById('quickNew')?.addEventListener('click',CU.quickNew);
  document.getElementById('userBtn')?.addEventListener('click',CU.userMenu);
  document.getElementById('contextClose')?.addEventListener('click',CU.clearContext);
  const gs=document.getElementById('globalSearch');if(gs){gs.oninput=()=>CU.renderSearch(gs.value);gs.onfocus=()=>{if(gs.value.trim())CU.renderSearch(gs.value)}}
  const ms=document.getElementById('mobileSearchBtn');if(ms)ms.onclick=()=>{document.getElementById('searchWrap').classList.toggle('mobile-open');setTimeout(()=>document.getElementById('globalSearch')?.focus(),20)};
};

CU.bindScene=()=>{
  document.querySelectorAll('[data-open-entity]').forEach(e=>e.onclick=()=>CU.openEntity(e.dataset.type,e.dataset.openEntity));
  document.querySelectorAll('[data-priority]').forEach(e=>e.onclick=()=>CU.openEntity(e.dataset.type,e.dataset.priority));
  document.querySelectorAll('[data-prospect-qualify]').forEach(e=>e.onclick=()=>CU.qualifyProspect(e.dataset.prospectQualify));
  document.querySelectorAll('[data-prospect-action]').forEach(e=>e.onclick=()=>CU.actionForm('prospect',e.dataset.prospectAction));
  document.querySelectorAll('[data-filter]').forEach(e=>e.onchange=()=>{CU.state.ui.filters[e.dataset.filter]=e.value;CU.saveState('filter');CU.renderScene();CU.bindScene()});
  document.querySelectorAll('[data-finance-view]').forEach(e=>e.onclick=()=>{CU.state.ui.financeView=e.dataset.financeView;CU.saveState('finance.view');CU.renderScene();CU.bindScene()});
  document.querySelectorAll('[data-work-view]').forEach(e=>e.onclick=()=>{CU.state.ui.workView=e.dataset.workView;CU.saveState('work.view');CU.renderScene();CU.bindScene()});
  document.querySelectorAll('[data-manual]').forEach(e=>e.onclick=()=>{CU.state.ui.manualTopic=e.dataset.manual;CU.saveState('manual');CU.renderScene();CU.bindScene()});
  document.querySelectorAll('[data-toggle-action]').forEach(e=>e.onclick=()=>CU.toggleAction(e.dataset.toggleAction));
  document.querySelectorAll('[data-budget-edit]').forEach(e=>e.onclick=()=>CU.editBudget(e.dataset.budgetEdit));
  document.querySelectorAll('[data-set-balance]').forEach(e=>e.onclick=CU.setOpeningBalance);
  document.querySelectorAll('[data-route-jump]').forEach(e=>e.onclick=()=>CU.openRoute(e.dataset.routeJump));
  document.querySelectorAll('[data-pay-receivable]').forEach(e=>e.onclick=()=>CU.paymentForm(e.dataset.payReceivable));
  document.querySelectorAll('[data-pay-expense]').forEach(e=>e.onclick=()=>CU.markExpensePaid(e.dataset.payExpense));
  const buttons={todayNew:CU.quickNew,newProspectBtn:CU.prospectForm,newDealBtn:CU.dealForm,newClientAction:()=>CU.actionForm(),newActionBtn:()=>CU.actionForm(),newProjectBtn:CU.projectForm,newExpenseBtn:CU.expenseForm,registerPaymentBtn:()=>CU.paymentForm()};
  Object.entries(buttons).forEach(([id,fn])=>{const e=document.getElementById(id);if(e)e.onclick=fn});
  const cf=document.getElementById('clientFilter');if(cf)cf.oninput=()=>CU.filterClients(cf.value);
  CU.setupDrag();

CU.renderContext=()=>{
  const box=document.getElementById('contextBody');if(!box)return;const html=CU.contextHTML();box.innerHTML=html;
  const mob=document.getElementById('mobileContext');if(mob)mob.innerHTML=`<div class="context-head"><span>DETALHES</span><button class="icon-button" id="mobileCtxClose">×</button></div><div class="context-body">${html}</div>`;
  CU.bindContext();
};

CU.bindContext=()=>{
  document.querySelectorAll('[data-deal-action]').forEach(b=>b.onclick=()=>CU.dealAction(b.dataset.dealAction,b.dataset.id));
  document.querySelectorAll('[data-deal-final]').forEach(b=>b.onclick=()=>CU.dealFinal(b.dataset.dealFinal,b.dataset.id));
  document.querySelectorAll('.context-body [data-toggle-action]').forEach(b=>b.onclick=()=>CU.toggleAction(b.dataset.toggleAction));
  document.querySelectorAll('[data-client-action]').forEach(b=>b.onclick=()=>CU.actionForm('client',b.dataset.clientAction));
  document.querySelectorAll('[data-project-action]').forEach(b=>b.onclick=()=>CU.actionForm('project',b.dataset.projectAction));
  document.getElementById('mobileCtxClose')?.addEventListener('click',CU.closeMobileContext);
};

CU.openRoute=route=>{CU.state.ui.route=route;CU.state.ui.context=null;CU.session.route=route;CU.session.focus=route;CU.saveSession();CU.saveState('route');CU.publishPresence();CU.renderApp()};
CU.clearContext=()=>{CU.state.ui.context=null;CU.renderContext();CU.closeMobileContext()};
CU.openEntity=(type,id)=>{
  CU.closeFloating();
  if(type==='deal'){CU.state.ui.route='sales';CU.state.ui.context={type:'deal',id}}
  if(type==='client'){CU.state.ui.route='clients';CU.state.ui.context={type:'client',id}}
  if(type==='project'){CU.state.ui.route='work';CU.state.ui.workView='projects';CU.state.ui.context={type:'project',id}}
  if(type==='action'){CU.state.ui.route='work';CU.state.ui.workView='actions';CU.state.ui.context={type:'action',id}}
  CU.session.focus=`${type}:${id}`;CU.saveSession();CU.saveState('open.entity');CU.renderApp();CU.openMobileContext();
};

CU.searchData=q=>{
  q=q.trim().toLowerCase();if(!q)return{};
  const match=(...v)=>v.some(x=>String(x||'').toLowerCase().includes(q));
  return{
    Vendas:CU.state.deals.filter(d=>match(d.name,d.contact,d.service,d.nextTitle)).slice(0,5).map(d=>({label:d.name,sub:`${CU.stageName(d.stage)} · ${CU.money(d.value)}`,type:'deal',id:d.id})),
    Clientes:CU.state.clients.filter(c=>match(c.name,c.contact,c.service,c.email)).slice(0,5).map(c=>({label:c.name,sub:`${c.contact} · ${c.service}`,type:'client',id:c.id})),
    Projetos:CU.state.projects.filter(p=>match(p.name,CU.clientName(p.clientId),p.status)).slice(0,5).map(p=>({label:CU.projectName(p),sub:`${p.progress}% · ${p.status}`,type:'project',id:p.id})),
    Ações:CU.state.actions.filter(a=>match(a.title,CU.entityLabel(a.entityType,a.entityId))).slice(0,5).map(a=>({label:a.title,sub:`${CU.fmtDate(a.due)} · ${CU.ownerName(a.owner)}`,type:'action',id:a.id}))
  };
};
CU.renderSearch=q=>{
  const box=document.getElementById('searchResults');if(!box)return;const groups=CU.searchData(q);let html='';
  Object.entries(groups).forEach(([g,items])=>{if(items.length)html+=`<div class="search-group">${g}</div>`+items.map(i=>`<div class="search-item" data-search-type="${i.type}" data-search-id="${i.id}"><div><b>${CU.esc(i.label)}</b><span>${CU.esc(i.sub)}</span></div><span>abrir</span></div>`).join('')});
  box.innerHTML=html||'<div class="search-group">Nenhum resultado</div>';box.classList.remove('hidden');box.querySelectorAll('[data-search-id]').forEach(el=>el.onclick=()=>CU.openEntity(el.dataset.searchType,el.dataset.searchId));
};
CU.userMenu=()=>{
  CU.closeFloating();const box=document.createElement('div');box.className='user-menu';box.id='floatingMenu';box.innerHTML=`<div style="padding:10px;font-size:10px;color:var(--muted)">${CU.ownerName(CU.session.user)} · ${CU.session.user}</div><button id="resetDemo">Reiniciar modo treino</button><button id="logoutMenu">Sair</button>`;document.body.appendChild(box);
  document.getElementById('logoutMenu').onclick=CU.logout;document.getElementById('resetDemo').onclick=()=>{if(confirm('Reiniciar todos os dados sintéticos deste CRM?')){CU.state=CU.seed();CU.saveState('reset');CU.renderApp();CU.toast('Modo treino reiniciado','info')}};
};
CU.closeFloating=()=>{document.getElementById('floatingMenu')?.remove();document.getElementById('searchResults')?.classList.add('hidden')};
CU.filterClients=q=>{q=q.toLowerCase();document.querySelectorAll('.list-item[data-type="client"]').forEach(el=>{const c=CU.state.clients.find(x=>x.id===el.dataset.openEntity);el.style.display=(c.name+' '+c.contact+' '+c.service).toLowerCase().includes(q)?'block':'none'})};

CU.setupDrag=()=>{
  document.querySelectorAll('.deal').forEach(d=>{d.ondragstart=e=>{window.__dragDeal=d.dataset.openEntity;e.dataTransfer.effectAllowed='move'}});
  document.querySelectorAll('.stage').forEach(s=>{s.ondragover=e=>{e.preventDefault();s.classList.add('dragover')};s.ondragleave=()=>s.classList.remove('dragover');s.ondrop=e=>{e.preventDefault();s.classList.remove('dragover');const id=window.__dragDeal;if(id)CU.requestAdvance(id,s.dataset.stage)}});
};
CU.openMobileContext=()=>{if(innerWidth<=980)document.getElementById('mobileContext')?.classList.add('open')};
CU.closeMobileContext=()=>document.getElementById('mobileContext')?.classList.remove('open');

document.addEventListener('click',e=>{if(!e.target.closest('#userBtn')&&!e.target.closest('#floatingMenu'))document.getElementById('floatingMenu')?.remove();if(!e.target.closest('#searchWrap'))document.getElementById('searchResults')?.classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){CU.closeModal();CU.closeMobileContext();CU.closeFloating()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('searchWrap')?.classList.add('mobile-open');document.getElementById('globalSearch')?.focus()}});
window.addEventListener('beforeunload',CU.stopPresence);

if(CU.session){CU.startPresence();CU.renderApp()}else CU.renderLogin();
})();
</script>
